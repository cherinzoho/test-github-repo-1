# Robot arm parameters — valid YAML (passes check-yaml)
arm_node:
  ros__parameters:
    joint_names:
      - shoulder_pan
      - shoulder_lift
      - elbow_flex
      - wrist_1
      - wrist_2
      - wrist_3
    max_velocity: 0.5         # rad/s
    max_acceleration: 1.0     # rad/s²
    home_position: [0.0, -1.57, 1.57, -1.57, -1.57, 0.0]
    control_frequency: 50.0   # Hz

    safety:
      torque_limit: 50.0      # Nm
      position_tolerance: 0.01  # rad
      emergency_stop_deceleration: 5.0
